[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grib2-template53-unpacker"
version = "0.1.0"
description = "Strict from-scratch decoder for concatenated GRIB2 Templates 5.3 and 7.3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "GRIB2 unpacker contributors" }]

[project.scripts]
grib2-unpack = "grib2_unpack.cli:main"

[tool.setuptools]
packages = ["grib2_unpack"]
